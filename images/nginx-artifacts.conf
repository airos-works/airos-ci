# The build server's web site on port 80 (installed by images/serve-artifacts.sh):
# the image files that images/build-image.sh publishes to /data2/airos/artifacts,
# under /images/, the System Updater feeds images/publish-update.py makes, under
# /updates/, and the build dashboard (dashboard/server.py) for the rest.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    sendfile on;

    location /images/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
    location ~ ^/images/.*\.(xz|sha256)$ {
        types { }
        default_type application/octet-stream;
    }

    # System Updater: index.json and update.json change with every build,
    # the packages never do (they are stored by their SHA-256).
    location /updates/ {
        autoindex on;
        autoindex_exact_size off;
        location ~ \.json$ {
            add_header Cache-Control "no-cache";
        }
        location ~ \.hpkg$ {
            types { }
            default_type application/x-vnd.haiku-package;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
